<svg width="100%" viewBox="0 0 800 780" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>MVP system architecture v2</title>
  <desc>Three layers with the backend as the hub: web platform and Android app both talk to the backend over HTTPS; an SMS gateway carries small text-only fallbacks. Adds workers, device security, form versioning and an audit log.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #2C2C2A; }
    .sub   { font-size: 12px; fill: #5F5E5A; }
    .lh    { font-size: 14px; font-weight: 600; }
    .ls    { font-size: 12px; }
    .bt    { font-size: 13px; font-weight: 600; fill: #444441; text-anchor: middle; }
    .bl    { font-size: 12px; fill: #5F5E5A; text-anchor: middle; }
    .box   { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.5; }
    .web { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }  .webt { fill: #085041; } .webs { fill: #0F6E56; }
    .be  { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.75; }  .bet  { fill: #712B13; } .bes  { fill: #993C1D; }
    .mob { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.75; }  .mobt { fill: #3C3489; } .mobs { fill: #534AB7; }
    .wire { fill: none; stroke: #73726C; stroke-width: 1.5; }
    .sms  { fill: none; stroke: #BA7517; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .wl   { font-size: 12px; fill: #3D3D3A; }
    .smsl { font-size: 12px; fill: #854F0B; }
    .pill { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
    .pt   { font-size: 10px; font-weight: 600; fill: #854F0B; text-anchor: middle; }
  </style>
  <rect width="800" height="780" fill="#FFFFFF"/>

  <text x="20" y="30" class="title">Phase 1 MVP system architecture (v2)</text>
  <text x="20" y="48" class="sub">The backend is the hub: the web platform and the phones never talk to each other directly.</text>

  <!-- ===== Web platform ===== -->
  <rect x="20" y="64" width="760" height="140" rx="14" class="web"/>
  <text x="36" y="88" class="lh webt">Web platform (browser)</text>
  <text x="36" y="104" class="ls webs">Form design, project management, data review</text>

  <rect x="40" y="116" width="229" height="72" rx="8" class="box"/>
  <text x="154" y="138" class="bt">Form designer</text>
  <text x="154" y="158" class="bl">XLSForm import, then visual builder</text>
  <text x="154" y="174" class="bl">versioned, multi-language</text>
  <rect x="211" y="122" width="52" height="16" rx="8" class="pill"/><text x="237" y="134" class="pt">changed</text>

  <rect x="285" y="116" width="229" height="72" rx="8" class="box"/>
  <text x="399" y="138" class="bt">Project manager</text>
  <text x="399" y="158" class="bl">deploy forms, roles, quotas</text>
  <text x="399" y="174" class="bl">users + device management</text>

  <rect x="530" y="116" width="229" height="72" rx="8" class="box"/>
  <text x="644" y="138" class="bt">Data review</text>
  <text x="644" y="158" class="bl">approve / reject / flag</text>
  <text x="644" y="174" class="bl">export CSV, XLSX</text>

  <!-- web <-> backend -->
  <line x1="400" y1="206" x2="400" y2="238" class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="412" y="226" class="wl">HTTPS · REST API</text>

  <!-- ===== Backend ===== -->
  <rect x="20" y="240" width="760" height="190" rx="14" class="be"/>
  <text x="36" y="264" class="lh bet">Backend + cloud</text>
  <text x="36" y="280" class="ls bes">API, workers, storage, security. Hosted in an African region (e.g. AWS af-south-1) or in-country.</text>

  <rect x="40" y="294" width="171" height="120" rx="8" class="box"/>
  <text x="125" y="316" class="bt">REST API</text>
  <text x="125" y="336" class="bl">auth (OIDC / JWT)</text>
  <text x="125" y="352" class="bl">form CRUD + versions</text>
  <text x="125" y="368" class="bl">idempotent ingest</text>
  <text x="125" y="384" class="bl">webhook events</text>
  <rect x="153" y="392" width="52" height="16" rx="8" class="pill"/><text x="179" y="404" class="pt">changed</text>

  <rect x="223" y="294" width="171" height="120" rx="8" class="box"/>
  <text x="308" y="316" class="bt">Workers + queue</text>
  <text x="308" y="336" class="bl">media processing</text>
  <text x="308" y="352" class="bl">export jobs</text>
  <text x="308" y="368" class="bl">SMS decode + ingest</text>
  <text x="308" y="384" class="bl">data quality checks</text>
  <rect x="346" y="392" width="42" height="16" rx="8" class="pill"/><text x="367" y="404" class="pt">new</text>

  <rect x="406" y="294" width="171" height="120" rx="8" class="box"/>
  <text x="491" y="316" class="bt">Data store</text>
  <text x="491" y="336" class="bl">PostgreSQL</text>
  <text x="491" y="352" class="bl">S3-compatible objects</text>
  <text x="491" y="368" class="bl">encrypted at rest</text>
  <text x="491" y="384" class="bl">region-pinned</text>

  <rect x="589" y="294" width="171" height="120" rx="8" class="box"/>
  <text x="674" y="316" class="bt">Security + audit</text>
  <text x="674" y="336" class="bl">TLS in transit</text>
  <text x="674" y="352" class="bl">role-based access</text>
  <text x="674" y="368" class="bl">audit log</text>
  <text x="674" y="384" class="bl">opt-in E2E per project</text>
  <rect x="702" y="392" width="52" height="16" rx="8" class="pill"/><text x="728" y="404" class="pt">changed</text>

  <!-- mobile <-> backend (internet) -->
  <line x1="300" y1="432" x2="300" y2="518" class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="312" y="468" class="wl">HTTPS sync</text>
  <text x="312" y="484" class="wl">forms ↓ · data ↑ · resumable</text>

  <!-- SMS gateway -->
  <line x1="674" y1="518" x2="674" y2="500" class="sms" marker-end="url(#arrow)"/>
  <rect x="589" y="452" width="171" height="46" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.75"/>
  <text x="674" y="471" class="bt" style="fill:#633806">SMS gateway</text>
  <text x="674" y="488" class="bl" style="fill:#854F0B">Africa's Talking / Twilio</text>
  <line x1="674" y1="452" x2="674" y2="434" class="sms" marker-end="url(#arrow)"/>
  <text x="664" y="513" class="smsl" text-anchor="end">text-only fallback</text>

  <!-- ===== Mobile ===== -->
  <rect x="20" y="520" width="760" height="190" rx="14" class="mob"/>
  <text x="36" y="544" class="lh mobt">Mobile app: Android first (iOS in Phase 2)</text>
  <text x="36" y="560" class="ls mobs">Offline-first: works with zero connectivity, on low-end phones (target Android 8+, 2 GB RAM)</text>

  <rect x="40" y="574" width="171" height="120" rx="8" class="box"/>
  <text x="125" y="596" class="bt">Offline form engine</text>
  <text x="125" y="616" class="bl">ODK XForm compatible</text>
  <text x="125" y="632" class="bl">SQLite + schema cache</text>
  <text x="125" y="648" class="bl">form version pinning</text>
  <text x="125" y="664" class="bl">validation, GPS point</text>

  <rect x="223" y="574" width="171" height="120" rx="8" class="box"/>
  <text x="308" y="596" class="bt">Media capture</text>
  <text x="308" y="616" class="bl">photo, audio, video</text>
  <text x="308" y="632" class="bl">on-device compression</text>
  <text x="308" y="648" class="bl">barcode / QR scan</text>
  <text x="308" y="664" class="bl">signature pad</text>

  <rect x="406" y="574" width="171" height="120" rx="8" class="box"/>
  <text x="491" y="596" class="bt">Sync engine</text>
  <text x="491" y="616" class="bl">outbox queue</text>
  <text x="491" y="632" class="bl">UUID = no duplicates</text>
  <text x="491" y="648" class="bl">chunked media upload</text>
  <text x="491" y="664" class="bl">SMS: key fields only</text>
  <rect x="519" y="672" width="52" height="16" rx="8" class="pill"/><text x="545" y="684" class="pt">changed</text>

  <rect x="589" y="574" width="171" height="120" rx="8" class="box"/>
  <text x="674" y="596" class="bt">Device security</text>
  <text x="674" y="616" class="bl">encrypted DB (SQLCipher)</text>
  <text x="674" y="632" class="bl">PIN unlock</text>
  <text x="674" y="648" class="bl">remote wipe</text>
  <text x="674" y="664" class="bl">consent capture</text>
  <rect x="712" y="672" width="42" height="16" rx="8" class="pill"/><text x="733" y="684" class="pt">new</text>

  <!-- Legend -->
  <rect x="20" y="732" width="42" height="16" rx="8" class="pill"/><text x="41" y="744" class="pt">new</text>
  <text x="70" y="744" class="sub">added in v2</text>
  <rect x="150" y="732" width="52" height="16" rx="8" class="pill"/><text x="176" y="744" class="pt">changed</text>
  <text x="210" y="744" class="sub">revised from v1</text>
  <line x1="320" y1="740" x2="350" y2="740" class="sms"/>
  <text x="358" y="744" class="sub">SMS path (no internet, small text payloads only)</text>
  <text x="20" y="768" class="sub">Rationale for each change: DESIGN_NOTES.md</text>
</svg>
