<svg width="100%" viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Phase 1 architecture on ODK</title>
  <desc>Phase 1 built by extending ODK: stock ODK Central on AWS af-south-1 with RDS and S3, a branded fork of ODK Collect, and a Kotlin Bridge service that receives SMS fallbacks from Africa's Talking and writes them into Central.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #2C2C2A; }
    .sub   { font-size: 12px; fill: #5F5E5A; }
    .bt    { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .bl    { font-size: 12px; text-anchor: middle; }
    .stock { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; } .st { fill: #444441; } .ss { fill: #5F5E5A; }
    .ours  { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; } .ot { fill: #085041; } .os { fill: #0F6E56; }
    .ext   { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.75; } .et { fill: #633806; } .es { fill: #854F0B; }
    .aws   { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.75; }
    .store { fill: #FFFFFF; stroke: #185FA5; stroke-width: 0.75; } .at { fill: #0C447C; } .as { fill: #185FA5; }
    .w   { fill: none; stroke: #73726C; stroke-width: 1.5; }
    .wa  { fill: none; stroke: #BA7517; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .lbl { font-size: 12px; fill: #3D3D3A; }
  </style>
  <rect width="800" height="600" fill="#FFFFFF"/>

  <text x="20" y="30" class="title">Phase 1 architecture: extending ODK</text>
  <text x="20" y="48" class="sub">Reuse ODK Central and ODK Collect; build only the parts that make the platform different.</text>

  <!-- Row 1: clients + external -->
  <rect x="40" y="70" width="220" height="90" rx="8" class="stock"/>
  <text x="150" y="96" class="bt st">Web browser</text>
  <text x="150" y="116" class="bl ss">Central web UI + Enketo</text>
  <text x="150" y="132" class="bl ss">design, review, export</text>

  <rect x="300" y="70" width="260" height="90" rx="8" class="ours"/>
  <text x="430" y="96" class="bt ot">Branded Collect (fork)</text>
  <text x="430" y="116" class="bl os">Android 8+, Kotlin</text>
  <text x="430" y="132" class="bl os">+ SMS fallback, wipe on revoke</text>

  <rect x="600" y="70" width="160" height="90" rx="8" class="ext"/>
  <text x="680" y="96" class="bt et">SMS gateway</text>
  <text x="680" y="116" class="bl es">Africa's Talking</text>
  <text x="680" y="132" class="bl es">inbound webhook</text>

  <!-- Collect -> SMS gateway -->
  <line x1="560" y1="115" x2="598" y2="115" class="wa" marker-end="url(#arrow)"/>
  <text x="579" y="107" class="lbl" text-anchor="middle" style="fill:#854F0B">SMS</text>

  <!-- AWS region -->
  <rect x="20" y="200" width="760" height="340" rx="14" class="aws"/>

  <!-- vertical arrows into region -->
  <line x1="150" y1="160" x2="150" y2="268" class="w" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="158" y="185" class="lbl">HTTPS</text>
  <line x1="340" y1="160" x2="340" y2="268" class="w" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="348" y="185" class="lbl">OpenRosa / HTTPS</text>
  <line x1="680" y1="160" x2="680" y2="268" class="wa" marker-end="url(#arrow)"/>
  <text x="688" y="185" class="lbl" style="fill:#854F0B">webhook</text>

  <!-- Central -->
  <rect x="40" y="270" width="330" height="120" rx="8" class="stock"/>
  <text x="205" y="294" class="bt st">ODK Central (stock, Docker)</text>
  <text x="205" y="316" class="bl ss">forms, versions, XLSForm (pyxform)</text>
  <text x="205" y="334" class="bl ss">submissions + review states</text>
  <text x="205" y="352" class="bl ss">users, roles, audit log</text>
  <text x="205" y="370" class="bl ss">OData / CSV export, managed encryption</text>

  <!-- Bridge -->
  <rect x="430" y="270" width="330" height="120" rx="8" class="ours"/>
  <text x="595" y="294" class="bt ot">Bridge service (ours, Kotlin / Ktor)</text>
  <text x="595" y="316" class="bl os">SMS webhook → decrypt + validate</text>
  <text x="595" y="334" class="bl os">write partial records into Central</text>
  <text x="595" y="352" class="bl os">mark merged when full record arrives</text>
  <text x="595" y="370" class="bl os">usage metering (billing in Phase 2)</text>

  <!-- Bridge <-> Central -->
  <line x1="372" y1="330" x2="428" y2="330" class="w" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="400" y="322" class="lbl" text-anchor="middle">REST</text>

  <!-- storage -->
  <line x1="205" y1="390" x2="205" y2="428" class="w" marker-end="url(#arrow)"/>
  <line x1="595" y1="390" x2="595" y2="428" class="w" marker-end="url(#arrow)"/>
  <rect x="40" y="430" width="720" height="66" rx="8" class="store"/>
  <text x="400" y="456" class="bt at">Amazon RDS PostgreSQL  ·  Amazon S3</text>
  <text x="400" y="476" class="bl as">Central DB + Bridge schema · media files + nightly backups · all encrypted at rest (KMS)</text>

  <text x="36" y="524" class="sub" style="fill:#0C447C">AWS af-south-1 (Cape Town). For a ministry that requires it: the same Docker stack in an in-country data centre.</text>

  <!-- legend -->
  <rect x="20" y="564" width="14" height="14" rx="3" class="stock"/><text x="40" y="575" class="sub">stock ODK, unmodified</text>
  <rect x="190" y="564" width="14" height="14" rx="3" class="ours"/><text x="210" y="575" class="sub">built or modified by us</text>
  <rect x="370" y="564" width="14" height="14" rx="3" class="ext"/><text x="390" y="575" class="sub">external service</text>
  <rect x="510" y="564" width="14" height="14" rx="3" class="store"/><text x="530" y="575" class="sub">AWS managed service</text>
</svg>
